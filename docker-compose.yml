
services:

  koya-clinic:
    container_name: koya-clinic-app

    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_KEY: ${API_KEY}

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////data/clinic.db
      SEED_DEMO_SLOTS: "true"

    volumes:
      - clinic_data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  clinic_data:
    name: koya_clinic_data
